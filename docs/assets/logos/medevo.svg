  <path id="clearance-left-lung" d="M51 60 C42 60 30 80 29 104 C28 117 37 120 51 111 Q55 108 55 100 V66 Q55 60 51 60 Z" fill="#FFFFFF" stroke-width="12"/>
  <path id="clearance-right-lung" d="M69 60 C78 60 89 80 90 104 C91 117 82 120 69 111 Q65 108 65 100 V66 Q65 60 69 60 Z" fill="#FFFFFF" stroke-width="12"/>
  <path id="clearance-airway" d="M60 46 V69 M60 67 L48 82 M60 67 L72 82" fill="none" stroke-width="12"/>
</g>
<g id="medical-image" transform="translate(100 18) scale(0.85)" inkscape:groupmode="layer" inkscape:label="01 Chest image" stroke="#287DB1" stroke-linecap="round" stroke-linejoin="round">
