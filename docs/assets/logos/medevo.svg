  <path id="upper-left-neuron" d="M183 37 C196 39 204 48 206 61"/>
  <path id="upper-middle-neuron" d="M223 30 C229 36 232 42 232 48 C241 46 250 49 257 53"/>
  <path id="upper-right-neuron" d="M287 70 C287 76 283 79 279 81"/>
  <path id="lower-neuron" d="M177 122 C189 124 195 116 205 116 C222 109 236 111 248 119"/>
  <path id="lower-right-neuron" d="M209 135 C223 130 223 111 239 104 C250 99 260 100 271 103"/>
  <g id="neural-nodes" fill="#287DB1" stroke="none">
    <circle cx="206" cy="61" r="6.5"/><circle cx="232" cy="48" r="6.5"/><circle cx="257" cy="53" r="6.5"/><circle cx="279" cy="81" r="6.5"/>
    <circle cx="205" cy="116" r="6.5"/><circle cx="248" cy="119" r="6.5"/><circle cx="271" cy="103" r="6.5"/>
  </g>
</g>
