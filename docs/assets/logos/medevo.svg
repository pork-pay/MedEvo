<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="200" height="180" viewBox="100 0 200 180" role="img" aria-labelledby="title desc">
<title id="title">MedEvo — integrated medical reasoning and suffix repair</title>
<desc id="desc">The unchanged neural brain contains lungs inset into its left side. A purple reasoning prefix transitions to a teal repaired suffix at a marked boundary. All shapes are independently editable.</desc>
<g id="composition" transform="translate(5 3) scale(0.94)">

